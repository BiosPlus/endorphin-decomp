name: CI & Decompilation Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify-and-dashboard:
    name: Verify Repo Safety, Tooling & Publish Dashboard
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Legal safety gate (forbid .exe, .dll, .obj, or .local/ in Git)
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^\.local/|\.(exe|dll|obj|lib|pdb|idb)$)' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden proprietary binary or .local/ files tracked in Git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Legal safety check passed: 0 forbidden files tracked."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compile all CLI tools under tools/
        run: |
          mkdir -p /tmp/endorphin-tools
          go build -v -o /tmp/endorphin-tools/ ./tools/...
          go build ./tools/...
          git clean -fd

      - name: Generate decompilation scoreboard & HTML dashboard
        run: |
          mkdir -p docs
          {
            echo "## Endorphin 2.7.1 Decompilation Scoreboard"
            echo '```text'
            go run ./tools/status -html docs/index.html
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

  byte-match:
    name: MSVC 2005 Byte-for-Byte Parity Check
    runs-on: windows-latest
    needs: verify-and-dashboard
    if: vars.ENABLE_MSVC_CI == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download and unpack MSVC8 compiler bundle
        shell: pwsh
        env:
          MSVC8_ZIP_URL: ${{ secrets.MSVC8_ZIP_URL }}
          MSVC8_BUNDLE_URL: ${{ secrets.MSVC8_BUNDLE_URL }}
        run: |
          $url = if ($env:MSVC8_ZIP_URL) { $env:MSVC8_ZIP_URL } else { $env:MSVC8_BUNDLE_URL }
          if (-not $url) {
            Write-Error "Missing MSVC8_ZIP_URL secret."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path .local/msvc8 | Out-Null
          Invoke-WebRequest -Uri $url -OutFile .local/msvc8.zip
          Expand-Archive -Path .local/msvc8.zip -DestinationPath .local/msvc8 -Force

      - name: Run build_and_match against modified units in src/
        run: |
          go run ./tools/build_and_match -require-compiler -modified
