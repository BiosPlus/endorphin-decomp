name: CI & Decompilation Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  windows-ci:
    name: MSVC 2005 Parity & Dashboard (`windows-latest`)
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # tools/status reads commit dates/subjects from the full history, but nothing needs old file
          # contents: a blobless clone skips ~20k commits worth of ledger blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Legal safety gate (forbid .exe, .dll, .obj, docs/, or .local/ in Git)
        shell: pwsh
        run: |
          $forbidden = git ls-files | Select-String -Pattern '(^\.local/|^docs/|\.(exe|dll|obj|lib|pdb|idb)$)'
          if ($forbidden) {
            Write-Error "Forbidden binary, .local/, or docs/ files tracked in Git:`n$forbidden"
            exit 1
          }
          Write-Host "Legal safety check passed: 0 forbidden files tracked."

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          # No go.sum (stdlib only), so key the Go build cache on go.mod; otherwise setup-go skips caching
          # and every `go run` recompiles from scratch.
          cache-dependency-path: go.mod

      - name: Run Go tooling unit tests
        shell: pwsh
        run: |
          go test ./tools/status/... ./tools/liftwork/... ./tools/lift/...

      - name: Cache MSVC 2005 toolchain and local binaries
        id: cache-msvc8
        uses: actions/cache@v6
        with:
          path: |
            .local/msvc8
            .local/bin
          key: msvc8-toolchain-v2

      - name: Fetch MSVC 2005 toolchain from private vault (with Archive.org fallback)
        if: steps.cache-msvc8.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VAULT_READ_TOKEN }}
          VAULT_READ_TOKEN: ${{ secrets.VAULT_READ_TOKEN }}
        run: |
          if ($env:VAULT_READ_TOKEN) {
            go run ./tools/fetch_msvc8 -from-vault --repo BiosPlus/endorphin-ci-vault
          } else {
            go run ./tools/fetch_msvc8 -from-archive
          }

      - name: Download objdiff-cli.exe if not cached
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path .local/bin | Out-Null
          if (-not (Test-Path ".local/bin/objdiff-cli.exe")) {
            Write-Host "Downloading objdiff-cli-windows-x86_64.exe from encounter/objdiff..."
            gh release download --repo encounter/objdiff --pattern "objdiff-cli-windows-x86_64.exe" --output ".local/bin/objdiff-cli.exe" --clobber
          }

      - name: Verify all matched functions in src/ against build/units.json
        shell: pwsh
        run: |
          $output = go run ./tools/build_and_match -all -require-compiler
          if ($LASTEXITCODE -ne 0) {
            Write-Error "build_and_match failed"
            exit $LASTEXITCODE
          }
          Write-Host $output
          @(
            "## MSVC 2005 Byte-for-Byte Verification (`windows-latest`)"
            ""
            '```text'
            $output
            '```'
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Append decompilation scoreboard to step summary and generate HTML dashboard
        shell: pwsh
        run: |
          go run ./tools/status -ci | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          go run ./tools/status -html docs/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v5

  lift-ci:
    name: Lifted C++20 Verification (`ubuntu-latest`)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: go.mod

      - name: Run liftwork & lift unit tests
        run: go test ./tools/liftwork/... ./tools/lift/...

      - name: Audit all lifted functions (static semantic verification)
        run: |
          go build -o .local/bin/liftwork ./tools/liftwork
          ./.local/bin/liftwork audit --strict --samples 30 | tee /tmp/lift_audit.txt
          {
            echo "## Lifted C++20 Verification (\`ubuntu-latest\`)"
            echo ""
            echo '```text'
            ./.local/bin/liftwork status
            echo ""
            cat /tmp/lift_audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile-check all lifted/*.cpp translation units (C++20)
        run: |
          find lifted -name '*.cpp' ! -path 'lifted/wip/*' -print0 | \
            xargs -0 -P "$(nproc)" -I {} sh -c 'g++ -std=c++20 -c -o /dev/null -Wall -Wno-unused -Ilifted/include -Iinclude "$1" || { echo "COMPILE FAIL: $1" >&2; exit 1; }' _ {}
          echo "All lifted/*.cpp translation units compiled cleanly."
