name: CI & Decompilation Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  windows-ci:
    name: MSVC 2005 Parity & Dashboard (`windows-latest`)
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Legal safety gate (forbid .exe, .dll, .obj, docs/, or .local/ in Git)
        shell: pwsh
        run: |
          $forbidden = git ls-files | Select-String -Pattern '(^\.local/|^docs/|\.(exe|dll|obj|lib|pdb|idb)$)'
          if ($forbidden) {
            Write-Error "Forbidden binary, .local/, or docs/ files tracked in Git:`n$forbidden"
            exit 1
          }
          Write-Host "Legal safety check passed: 0 forbidden files tracked."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache MSVC 2005 toolchain and local binaries
        id: cache-msvc8
        uses: actions/cache@v4
        with:
          path: |
            .local/msvc8
            .local/bin
          key: msvc8-toolchain-v1

      - name: Fetch MSVC 2005 toolchain from private vault (with Archive.org fallback)
        if: steps.cache-msvc8.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VAULT_READ_TOKEN }}
          VAULT_READ_TOKEN: ${{ secrets.VAULT_READ_TOKEN }}
        run: |
          if ($env:VAULT_READ_TOKEN) {
            go run ./tools/fetch_msvc8 -from-vault --repo BiosPlus/endorphin-ci-vault
          } else {
            go run ./tools/fetch_msvc8 -from-archive
          }

      - name: Download objdiff-cli.exe if not cached
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path .local/bin | Out-Null
          if (-not (Test-Path ".local/bin/objdiff-cli.exe")) {
            Write-Host "Downloading objdiff-cli-windows-x86_64.exe from encounter/objdiff..."
            gh release download --repo encounter/objdiff --pattern "objdiff-cli-windows-x86_64.exe" --output ".local/bin/objdiff-cli.exe" --clobber
          }

      - name: Verify all matched functions in src/ against build/units.json
        shell: pwsh
        run: |
          $output = go run ./tools/build_and_match -all -require-compiler
          if ($LASTEXITCODE -ne 0) {
            Write-Error "build_and_match failed"
            exit $LASTEXITCODE
          }
          Write-Host $output
          @(
            "## MSVC 2005 Byte-for-Byte Verification (`windows-latest`)"
            ""
            '```text'
            $output
            '```'
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Append decompilation scoreboard to step summary and generate HTML dashboard
        shell: pwsh
        run: |
          go run ./tools/status -ci | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          go run ./tools/status -html docs/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
